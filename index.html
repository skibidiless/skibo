<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Strike 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050712;color:#fff;font-family:Inter,Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;z-index:5;text-shadow:0 3px 12px #000}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pill{padding:9px 13px;border:1px solid #ffffff20;background:#080c18cc;border-radius:12px;backdrop-filter:blur(8px);font-weight:800}
.health{width:190px;height:12px;border-radius:20px;overflow:hidden;border:1px solid #ffffff30;background:#0008}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#30f28a,#8cff59);box-shadow:0 0 16px #30f28a}
#crosshair{position:fixed;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none;z-index:6}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 10px #4ff}
#crosshair:before{width:2px;height:20px;left:9px;top:0}
#crosshair:after{height:2px;width:20px;left:0;top:9px}
#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;padding:9px 13px;border:1px solid #ffffff18;background:#080c18c7;border-radius:10px;color:#b7c3dd;font-size:13px;white-space:nowrap;pointer-events:none}
#banner{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:6;font-weight:900;font-size:36px;letter-spacing:5px;opacity:0;pointer-events:none;text-shadow:0 0 24px #00eaff}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#02040bcc;z-index:20;visibility:hidden}
.card{width:min(440px,calc(100vw - 32px));padding:34px;border:1px solid #ffffff1f;border-radius:22px;background:linear-gradient(180deg,#111827f2,#070b14f2);box-shadow:0 30px 120px #000;text-align:center}
.card h1{margin:0 0 8px;font-size:44px;letter-spacing:3px}
.card p{color:#aebbd4}
button{border:0;border-radius:12px;padding:13px 22px;background:#32ed84;color:#04100a;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 8px 30px #32ed8440}
button:hover{filter:brightness(1.08)}
#damage{position:fixed;inset:0;background:radial-gradient(circle,#f00 0%,transparent 58%);opacity:0;z-index:4;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="damage"></div>
<div id="crosshair"></div>
<div id="banner"></div>
<div id="hud">
  <div class="top">
    <div class="pill">❤️ <span id="hp">100</span></div>
    <div class="health"><div id="hpbar"></div></div>
    <div class="pill">🎯 <span id="score">0</span></div>
    <div class="pill">🌊 WAVE <span id="wave">1</span></div>
    <div class="pill">👾 <span id="alive">0</span></div>
  </div>
</div>
<div id="help">WASD / Arrow Keys = move · Mouse = aim · Click / Space = shoot · R = restart</div>
<div id="overlay"><div class="card"><h1>GAME OVER</h1><p>You survived to wave <b id="finalWave">1</b> with <b id="finalScore">0</b> points.</p><button id="restart">PLAY AGAIN</button></div></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.180.0/build/three.module.js';

const root=document.getElementById('game');
const hpEl=document.getElementById('hp'),hpBar=document.getElementById('hpbar');
const scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),aliveEl=document.getElementById('alive');
const overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore'),finalWave=document.getElementById('finalWave');
const damage=document.getElementById('damage'),banner=document.getElementById('banner');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050712);
scene.fog=new THREE.Fog(0x050712,35,115);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,200);
camera.position.set(0,14,16);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x87a9ff,0x081018,1.5));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(12,22,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
scene.add(sun);

const arena=new THREE.Group();scene.add(arena);
const floorMat=new THREE.MeshStandardMaterial({color:0x11192b,metalness:.35,roughness:.72});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(110,110),floorMat);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;arena.add(floor);

const grid=new THREE.GridHelper(110,55,0x1a9dba,0x10213b);
grid.position.y=.012;grid.material.transparent=true;grid.material.opacity=.35;arena.add(grid);

function box(w,h,d,color,x,y,z,metal=.3){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,metalness:metal,roughness:.5}));
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;arena.add(m);return m;
}
for(const p of [[-28,2,-18],[25,2,-20],[-25,2,18],[27,2,20],[0,2,-31],[0,2,31]]){
  box(6,4,6,p[0],p[1],p[2],0x172744,.45);
}
for(let i=0;i<24;i++){
  const a=Math.random()*Math.PI*2,r=8+Math.random()*38;
  const s=1.2+Math.random()*2.2;
  box(s,1+Math.random()*3,s*.8,0x152034,(Math.cos(a)*r),(.5+Math.random()*1.4),(Math.sin(a)*r),.5);
}
const ring=new THREE.Mesh(new THREE.TorusGeometry(5.7,.06,8,64),new THREE.MeshBasicMaterial({color:0x25d9ff}));
ring.rotation.x=Math.PI/2;ring.position.y=.07;arena.add(ring);

const keys={};
let mouse={x:innerWidth/2,y:innerHeight/2,down:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')mouse.down=true;if(e.key.toLowerCase()==='r'&&gameOver)reset()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')mouse.down=false});
renderer.domElement.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
document.getElementById('restart').onclick=reset;

const raycaster=new THREE.Raycaster(),groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),ndc=new THREE.Vector2();
function aimPoint(){
  ndc.x=(mouse.x/innerWidth)*2-1;
  ndc.y=-(mouse.y/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const p=new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane,p);
  return p;
}

let player,gun,gunGlow,enemies=[],shots=[],fx=[],score=0,wave=1,spawnLeft=0,spawnTimer=0,fireCd=0,gameOver=false,last=0,shake=0,bannerTimer=0;

function makePlayer(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.78,.92,1.25,8),new THREE.MeshStandardMaterial({color:0x2ee9ff,metalness:.65,roughness:.28,emissive:0x063e55,emissiveIntensity:.8}));
  body.position.y=.8;body.castShadow=true;g.add(body);
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.58,1),new THREE.MeshStandardMaterial({color:0xe8fbff,metalness:.65,roughness:.2,emissive:0x0d5a75,emissiveIntensity:.55}));
  head.position.y=1.65;head.castShadow=true;g.add(head);
  const visor=new THREE.Mesh(new THREE.BoxGeometry(.72,.16,.12),new THREE.MeshBasicMaterial({color:0x07121c}));
  visor.position.set(0,1.69,-.54);g.add(visor);
  gun=new THREE.Group();
  const stock=new THREE.Mesh(new THREE.BoxGeometry(.35,.28,1.05),new THREE.MeshStandardMaterial({color:0x202a3c,metalness:.7,roughness:.25}));
  stock.position.z=-.25;gun.add(stock);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.10,.12,.9,10),new THREE.MeshStandardMaterial({color:0x93a7c7,metalness:.85,roughness:.2}));
  barrel.rotation.x=Math.PI/2;barrel.position.z=-.95;gun.add(barrel);
  gunGlow=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:0x66f4ff}));
  gunGlow.position.z=-1.42;gunGlow.visible=false;gun.add(gunGlow);
  gun.position.set(0,1.05,-.55);g.add(gun);
  scene.add(g);
  g.position.set(0,0,5);g.traverse(o=>{if(o.isMesh)o.castShadow=true});
  return g;
}

function enemyModel(elite){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:elite?0xff2c77:0xff4056,metalness:.5,roughness:.35,emissive:elite?0x4a0520:0x34030b,emissiveIntensity:.8});
  const body=new THREE.Mesh(new THREE.OctahedronGeometry(elite?1.15:.75,0),mat);body.position.y=1;body.castShadow=true;g.add(body);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(elite?.23:.16,12,12),new THREE.MeshBasicMaterial({color:0xfff36b}));
  eye.position.set(0,1.1,-.65);g.add(eye);
  if(elite){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.3,.07,6,24),new THREE.MeshBasicMaterial({color:0xff74aa}));
    ring.rotation.x=Math.PI/2;ring.position.y=1;g.add(ring);
  }
  return g;
}
function spawnEnemy(){
  const elite=Math.random()<Math.min(.08+wave*.012,.25);
  const side=Math.floor(Math.random()*4),edge=49;
  let x,z;
  if(side===0){x=-edge;z=(Math.random()-.5)*86}
  else if(side===1){x=edge;z=(Math.random()-.5)*86}
  else if(side===2){x=(Math.random()-.5)*86;z=-edge}
  else{x=(Math.random()-.5)*86;z=edge}
  const mesh=enemyModel(elite);mesh.position.set(x,0,z);scene.add(mesh);
  enemies.push({mesh,hp:elite?4:1,max:elite?4:1,elite,speed:(elite?2.0:2.65)+wave*.08,hit:0});
}
function muzzle(){
  gunGlow.visible=true;setTimeout(()=>gunGlow&&(gunGlow.visible=false),45);
  const a=new THREE.Vector3();gunGlow.getWorldPosition(a);
  const p=new THREE.Mesh(new THREE.SphereGeometry(.07+Math.random()*.06,8,8),new THREE.MeshBasicMaterial({color:0xffef89}));
  p.position.copy(a);scene.add(p);fx.push({mesh:p,life:.12,scale:1});
}
function createShot(from,to){
  const d=to.clone().sub(from).normalize();
  const m=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),new THREE.MeshBasicMaterial({color:0xffe86d}));
  m.position.copy(from);m.castShadow=true;scene.add(m);
  shots.push({mesh:m,dir:d,speed:35,life:1.25});
  for(let i=0;i<2;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0x63efff}));s.position.copy(from);scene.add(s);fx.push({mesh:s,life:.18,scale:1})}
  shake=.08;muzzle();
}
function hitFX(pos,elite=false){
  for(let i=0;i<(elite?18:10);i++){
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.06+Math.random()*.07,0),new THREE.MeshBasicMaterial({color:elite?0xff4d9a:0xffc857}));
    m.position.copy(pos);scene.add(m);
    const v=new THREE.Vector3(Math.random()-.5,.2+Math.random()*1.2,Math.random()-.5).normalize().multiplyScalar(4+Math.random()*9);
    fx.push({mesh:m,life:.35+Math.random()*.35,v,scale:1});
  }
}
function shoot(){
  if(gameOver||fireCd>0)return;
  const target=aimPoint(),from=new THREE.Vector3();gunGlow.getWorldPosition(from);
  target.y=1;
  createShot(from,target);
  fireCd=.13;
}
function announce(text){
  banner.textContent=text;banner.style.opacity='1';bannerTimer=1.3;
}
function reset(){
  if(player)scene.remove(player);
  for(const e of enemies)scene.remove(e.mesh);for(const s of shots)scene.remove(s.mesh);for(const f of fx)scene.remove(f.mesh);
  enemies=[];shots=[];fx=[];
  player=makePlayer();
  score=0;wave=1;spawnLeft=10;spawnTimer=.3;fireCd=0;gameOver=false;shake=0;overlay.style.visibility='hidden';announce('WAVE 1');updateHud();
}
function updateHud(){
  hpEl.textContent=Math.ceil(player.userData.hp||100);
  hpBar.style.width=Math.max(0,player.userData.hp||100)+'%';
  scoreEl.textContent=score;waveEl.textContent=wave;aliveEl.textContent=enemies.length;
}
player=makePlayer();player.userData.hp=100;

function update(dt){
  if(gameOver)return;
  const dtc=Math.min(dt,.033);
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
  player.position.x+=dx*10*dtc;player.position.z+=dz*10*dtc;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-43,43);player.position.z=THREE.MathUtils.clamp(player.position.z,-43,43);
  const target=aimPoint();const ang=Math.atan2(target.x-player.position.x,target.z-player.position.z);
  player.rotation.y=ang;
  gun.rotation.y=0;
  fireCd-=dtc;if(mouse.down)shoot();

  spawnTimer-=dtc;
  if(spawnLeft>0&&spawnTimer<=0){spawnEnemy();spawnLeft--;spawnTimer=Math.max(.22,.72-wave*.025)}
  if(spawnLeft===0&&enemies.length===0){wave++;spawnLeft=8+wave*3;spawnTimer=1.2;announce('WAVE '+wave);}

  for(const s of shots){
    s.mesh.position.addScaledVector(s.dir,s.speed*dtc);s.life-=dtc;
    for(const e of enemies){
      if(s.dead||!e.mesh.visible)continue;
      const d=s.mesh.position.distanceTo(new THREE.Vector3(e.mesh.position.x,1,e.mesh.position.z));
      if(d<e.elite?1.35:.95){
        s.dead=true;e.hp--;e.hit=.09;hitFX(s.mesh.position,e.elite);
        if(e.hp<=0){score+=e.elite?75:15;hitFX(e.mesh.position.clone().setY(1),e.elite);e.mesh.visible=false;}
      }
    }
  }
  shots=shots.filter(s=>{if(s.life<=0||s.dead){scene.remove(s.mesh);return false}return true});

  const pp=new THREE.Vector3(player.position.x,0,player.position.z);
  for(const e of enemies){
    if(!e.mesh.visible)continue;
    const ep=e.mesh.position.clone().setY(0),d=ep.distanceTo(pp);
    if(e.hit>0){e.hit-=dtc;e.mesh.scale.setScalar(1.18)}else e.mesh.scale.lerp(new THREE.Vector3(1,1,1),.2);
    if(d>1.7){const dir=pp.clone().sub(ep).normalize();e.mesh.position.addScaledVector(dir,e.speed*dtc)}
    if(d<1.7){
      player.userData.hp-= (e.elite?22:30)*dtc;
      damage.style.opacity=String(Math.min(.35,Math.max(0,(1-player.userData.hp/100)*.12)));
      shake=.16;
    }
  }
  enemies=enemies.filter(e=>{if(!e.mesh.visible){scene.remove(e.mesh);return false}return true});

  for(const f of fx){
    f.life-=dtc;if(f.v)f.mesh.position.addScaledVector(f.v,dtc);
    f.mesh.scale.multiplyScalar(1.02);
    f.mesh.material.opacity=Math.max(0,f.life*2);f.mesh.material.transparent=true;
  }
  fx=fx.filter(f=>{if(f.life<=0){scene.remove(f.mesh);return false}return true});

  const camTarget=new THREE.Vector3(player.position.x,player.position.y+.3,player.position.z);
  const desired=new THREE.Vector3(player.position.x,14,player.position.z+16);
  camera.position.lerp(desired,.1);
  const lookAt=camTarget.clone();camera.lookAt(lookAt);
  ring.position.x=player.position.x;ring.position.z=player.position.z;

  shake=Math.max(0,shake-dtc*1.8);
  if(shake){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake}
  bannerTimer-=dtc;if(bannerTimer<=0)banner.style.opacity=String(Math.max(0,bannerTimer+1.3));
  damage.style.opacity=String(Math.max(0,parseFloat(damage.style.opacity||0)-dtc*1.4));
  if(player.userData.hp<=0){
    player.userData.hp=0;gameOver=true;finalScore.textContent=score;finalWave.textContent=wave;overlay.style.visibility='visible';
  }
  updateHud();
}

function animate(t){
  const dt=(t-last)/1000||0;last=t;
  update(dt);
  const now=t*.001;
  ring.rotation.z=now*.7;
  ring.scale.setScalar(1+Math.sin(now*3)*.04);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
});
reset();requestAnimationFrame(animate);
</script>
</body>
</html>
