<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Strike 3D — Three.js</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05070e}
body{user-select:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;padding:18px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel{background:rgba(6,10,20,.78);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 13px;backdrop-filter:blur(10px);box-shadow:0 8px 25px rgba(0,0,0,.25);font-weight:800}
.health{width:190px;height:12px;border-radius:30px;overflow:hidden;background:#020308;border:1px solid rgba(255,255,255,.18)}
#healthFill{height:100%;width:100%;background:linear-gradient(90deg,#27f48a,#b6ff5e);box-shadow:0 0 18px rgba(39,244,138,.8)}
#reticle{position:fixed;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);z-index:7;pointer-events:none}
#reticle:before,#reticle:after{content:"";position:absolute;background:#fff;box-shadow:0 0 8px #25e5ff}
#reticle:before{width:2px;height:28px;left:13px}
#reticle:after{width:28px;height:2px;top:13px}
#help{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(6,10,20,.78);padding:9px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.1);color:#c7d1e5;font-size:13px;white-space:nowrap;pointer-events:none}
#tag{position:fixed;right:18px;bottom:15px;color:#5feaff;font-size:12px;font-weight:900;letter-spacing:2px;z-index:5;opacity:.8}
#waveBanner{position:fixed;left:50%;top:16%;transform:translate(-50%,-50%);font-size:46px;font-weight:1000;letter-spacing:7px;text-shadow:0 0 30px #00eaff;z-index:8;opacity:0;pointer-events:none}
#bossHud{position:fixed;left:50%;top:18px;transform:translateX(-50%);width:min(650px,72vw);z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
#bossTitle{text-align:center;font-size:13px;letter-spacing:4px;font-weight:1000;color:#ff77ad;text-shadow:0 0 14px #ff2e75;margin-bottom:5px}
#bossBar{height:18px;border:2px solid rgba(255,255,255,.2);border-radius:999px;background:#07020aee;overflow:hidden;box-shadow:0 0 30px rgba(255,25,100,.22)}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff174f,#ff5c9d,#ffd0df);box-shadow:0 0 20px #ff2f76}
#stormHud{position:fixed;right:18px;top:18px;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
#stormPill{padding:10px 14px;border:1px solid rgba(120,220,255,.28);background:rgba(5,18,30,.8);border-radius:12px;color:#9ff3ff;font-weight:1000;letter-spacing:2px;box-shadow:0 0 30px rgba(0,210,255,.12)}
#stormOverlay{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:linear-gradient(180deg,rgba(38,82,120,.18),rgba(0,0,25,.32))}
#flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,40,75,.05),rgba(255,0,0,.32));opacity:0;z-index:4;pointer-events:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,3,8,.82);z-index:20;visibility:hidden}
.card{width:min(460px,calc(100vw - 30px));padding:36px;border-radius:22px;text-align:center;background:linear-gradient(180deg,#141b2c,#080d17);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 100px #000}
.card h1{margin:0 0 8px;font-size:48px;letter-spacing:3px}
.card p{color:#aab8d3}
button{border:0;border-radius:12px;padding:13px 22px;background:#37ee86;color:#04120a;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(55,238,134,.25)}
button:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div id="game"></div>
<div id="flash"></div>
<div id="reticle"></div>
<div id="waveBanner"></div>
<div id="stormOverlay"></div>
<div id="bossHud"><div id="bossTitle">⚡ RAID BOSS — STORMBRINGER</div><div id="bossBar"><div id="bossFill"></div></div></div>
<div id="stormHud"><div id="stormPill">⛈ STORM ACTIVE</div></div>
<div id="hud">
  <div class="top">
    <div class="panel">❤️ <span id="hp">100</span></div>
    <div class="health"><div id="healthFill"></div></div>
    <div class="panel">SCORE <span id="score">0</span></div>
    <div class="panel">WAVE <span id="wave">1</span></div>
    <div class="panel">ENEMIES <span id="enemies">0</span></div>
  </div>
</div>
<div id="help">WASD / arrows = move · Mouse = aim · Click / Space = fire · R = restart</div>
<div id="tag">THREE.JS 3D</div>
<div id="overlay"><div class="card"><h1>GAME OVER</h1><p>Final score: <b id="finalScore">0</b> · Wave reached: <b id="finalWave">1</b></p><button id="restart">PLAY AGAIN</button></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const mount=document.getElementById('game');
const hpText=document.getElementById('hp');
const healthFill=document.getElementById('healthFill');
const scoreText=document.getElementById('score');
const waveText=document.getElementById('wave');
const enemiesText=document.getElementById('enemies');
const overlay=document.getElementById('overlay');
const finalScore=document.getElementById('finalScore');
const finalWave=document.getElementById('finalWave');
const flash=document.getElementById('flash');
const waveBanner=document.getElementById('waveBanner');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b16);
scene.fog=new THREE.Fog(0x070b16,35,125);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,220);
camera.position.set(0,10,14);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bb8ff,0x07101a,1.7));
const keyLight=new THREE.DirectionalLight(0xffffff,3.2);
keyLight.position.set(25,36,12);
keyLight.castShadow=true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.camera.left=-70;keyLight.shadow.camera.right=70;
keyLight.shadow.camera.top=70;keyLight.shadow.camera.bottom=-70;
scene.add(keyLight);

const cyanLight=new THREE.PointLight(0x14dbff,18,40,2);
cyanLight.position.set(0,6,0);scene.add(cyanLight);

const arena=new THREE.Group();
scene.add(arena);

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({color:0x111827,metalness:.25,roughness:.82})
);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;arena.add(floor);

const grid=new THREE.GridHelper(120,60,0x1a7388,0x142036);
grid.material.transparent=true;grid.material.opacity=.42;grid.position.y=.02;arena.add(grid);

const borderMat=new THREE.MeshStandardMaterial({color:0x18263f,metalness:.5,roughness:.45});
function addBox(w,h,d,x,z,color=0x1a2943){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,metalness:.45,roughness:.55}));
  m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;arena.add(m);return m;
}
for(const p of [[-31,-27,8,6],[29,-26,9,7],[-30,25,10,7],[31,24,8,8],[-3,-34,11,4],[2,34,12,4]]) addBox(p[2],4,p[3],p[0],p[1],0x172844);

for(let i=0;i<28;i++){
  const x=(Math.random()-.5)*88;
  const z=(Math.random()-.5)*88;
  const w=1.5+Math.random()*3.2;
  const h=1+Math.random()*3.5;
  const d=1.5+Math.random()*3.2;
  if(Math.hypot(x,z)<9) continue;
  addBox(w,h,d,x,z,0x13213a+Math.floor(Math.random()*4)*0x050505);
}

const ring=new THREE.Mesh(
  new THREE.TorusGeometry(6.3,.055,8,96),
  new THREE.MeshBasicMaterial({color:0x36e8ff})
);
ring.rotation.x=Math.PI/2;ring.position.y=.04;scene.add(ring);

const stormOverlay=document.getElementById('stormOverlay');
const stormHud=document.getElementById('stormHud');
const bossHud=document.getElementById('bossHud');
const bossFill=document.getElementById('bossFill');

const rainCount=650;
const rainPositions=new Float32Array(rainCount*6);
for(let i=0;i<rainCount;i++){
  const j=i*6;
  rainPositions[j]=(Math.random()-.5)*96;
  rainPositions[j+1]=Math.random()*30;
  rainPositions[j+2]=(Math.random()-.5)*96;
  rainPositions[j+3]=rainPositions[j]+.8;
  rainPositions[j+4]=rainPositions[j+1]-2.3;
  rainPositions[j+5]=rainPositions[j+2]+.6;
}
const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPositions,3));
const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0x8edfff,transparent:true,opacity:.3}));
rain.visible=false;scene.add(rain);

const stormLight=new THREE.DirectionalLight(0x8bcfff,0);
stormLight.position.set(-20,35,-10);scene.add(stormLight);
const lightningLight=new THREE.PointLight(0xd7f7ff,0,100);
lightningLight.position.set(0,24,0);scene.add(lightningLight);

const keys={};
const mouse={x:innerWidth/2,y:innerHeight/2,down:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')mouse.down=true;if(e.key.toLowerCase()==='r'&&gameOver)reset()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')mouse.down=false});
renderer.domElement.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
document.getElementById('restart').onclick=reset;

const raycaster=new THREE.Raycaster();
const cursor=new THREE.Vector2();
const aimPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function getAim(){
  cursor.x=mouse.x/innerWidth*2-1;
  cursor.y=-(mouse.y/innerHeight*2-1);
  raycaster.setFromCamera(cursor,camera);
  const p=new THREE.Vector3();
  raycaster.ray.intersectPlane(aimPlane,p);
  return p;
}

function mat(color,emissive=0x000000,ei=0){
  return new THREE.MeshStandardMaterial({color,metalness:.55,roughness:.35,emissive,emissiveIntensity:ei});
}

function makePlayer(){
  const g=new THREE.Group();

  const legs=new THREE.Group();
  const legMat=mat(0x253650);
  for(const x of [-.28,.28]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.32,.9,.36),legMat);
    leg.position.set(x,.45,0);leg.castShadow=true;legs.add(leg);
  }
  g.add(legs);

  const torso=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.25,.78),mat(0x28dce7,0x063d49,.9));
  torso.position.y=1.25;torso.castShadow=true;g.add(torso);

  const shoulder=new THREE.Mesh(new THREE.BoxGeometry(1.55,.28,.88),mat(0x172944));
  shoulder.position.y=1.78;shoulder.castShadow=true;g.add(shoulder);

  const head=new THREE.Mesh(new THREE.BoxGeometry(.82,.72,.72),mat(0xe2f3ff,0x10344a,.4));
  head.position.set(0,2.08,0);head.castShadow=true;g.add(head);

  const visor=new THREE.Mesh(new THREE.BoxGeometry(.65,.18,.12),new THREE.MeshBasicMaterial({color:0x07131c}));
  visor.position.set(0,2.1,-.37);g.add(visor);

  const gun=new THREE.Group();
  const receiver=new THREE.Mesh(new THREE.BoxGeometry(.38,.26,.8),mat(0x26334a));
  receiver.position.z=-.2;receiver.castShadow=true;gun.add(receiver);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,.95,12),mat(0xb6c6dc,0x001a26,.5));
  barrel.rotation.x=Math.PI/2;barrel.position.z=-.95;barrel.castShadow=true;gun.add(barrel);
  const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.12,12,12),new THREE.MeshBasicMaterial({color:0x9effff}));
  muzzle.position.z=-1.42;gun.add(muzzle);
  gun.position.set(0,1.35,-.58);
  g.add(gun);

  const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.25,32),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.4}));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=.01;shadow.scale.set(1,.55,1);g.add(shadow);

  g.userData.gun=gun;
  g.userData.muzzle=muzzle;
  g.userData.hp=100;
  scene.add(g);
  return g;
}

function makeEnemy(elite){
  const g=new THREE.Group();
  const bodyMat=mat(elite?0xff236f:0xff475d,elite?0x4b0520:0x3a060f,1);
  const body=new THREE.Mesh(new THREE.BoxGeometry(elite?1.7:1.25,1.55,1.05),bodyMat);
  body.position.y=1;body.castShadow=true;g.add(body);

  const head=new THREE.Mesh(new THREE.BoxGeometry(elite?1.05:.78,.62,.8),bodyMat);
  head.position.y=2;head.castShadow=true;g.add(head);

  const eye=new THREE.Mesh(new THREE.BoxGeometry(elite?.72:.48,.11,.08),new THREE.MeshBasicMaterial({color:0xffff83}));
  eye.position.set(0,2.02,-.43);g.add(eye);

  const armMat=mat(elite?0x6d1a46:0x461b26);
  for(const x of [-.9,.9]){
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.25,.9,.28),armMat);
    arm.position.set(x,1.05,0);arm.rotation.z=x>0?-.18:.18;arm.castShadow=true;g.add(arm);
  }
  const footMat=mat(0x151f31);
  for(const x of [-.33,.33]){
    const foot=new THREE.Mesh(new THREE.BoxGeometry(.3,.55,.46),footMat);
    foot.position.set(x,.28,0);foot.castShadow=true;g.add(foot);
  }

  if(elite){
    const aura=new THREE.Mesh(new THREE.TorusGeometry(1.42,.06,8,32),new THREE.MeshBasicMaterial({color:0xff5fa3}));
    aura.rotation.x=Math.PI/2;aura.position.y=1.1;g.add(aura);
  }
  scene.add(g);
  return g;
}

let player,enemies,bullets,enemyBullets,particles,score,wave,spawnRemaining,spawnTimer,fireTimer,gameOver,lastTime,shake,bannerTimer;
let bossQueued=false,bossShotTimer=0;
let storm={active:false,timer:14,duration:0,lightning:1.4};
function spawnRaidBoss(){
  const g=new THREE.Group();
  const armorMat=mat(0x232d49,0x170016,.9);
  const coreMat=mat(0x821846,0x55001e,2.2);

  const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.9,1),coreMat);
  core.position.y=2.6;core.castShadow=true;g.add(core);

  const body=new THREE.Mesh(new THREE.BoxGeometry(3.25,2.25,2.2),armorMat);
  body.position.y=2.25;body.castShadow=true;g.add(body);

  const head=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.18,1.85),mat(0x40172d,0x360016,1.5));
  head.position.y=4.15;head.castShadow=true;g.add(head);

  const visor=new THREE.Mesh(new THREE.BoxGeometry(1.6,.22,.12),new THREE.MeshBasicMaterial({color:0xffd2e4}));
  visor.position.set(0,4.18,-.95);g.add(visor);

  for(const sx of [-2,2]){
    const shoulder=new THREE.Mesh(new THREE.BoxGeometry(.72,2.7,.85),armorMat);
    shoulder.position.set(sx,2.25,0);
    shoulder.rotation.z=sx>0?-.12:.12;
    shoulder.castShadow=true;g.add(shoulder);
    const claw=new THREE.Mesh(new THREE.CylinderGeometry(.48,.58,1.1,8),coreMat);
    claw.rotation.x=Math.PI/2;claw.position.set(sx,1.0,-.2);claw.castShadow=true;g.add(claw);
  }

  const energyRing=new THREE.Mesh(new THREE.TorusGeometry(2.95,.11,10,56),new THREE.MeshBasicMaterial({color:0xff3b88}));
  energyRing.rotation.x=Math.PI/2;energyRing.position.y=2.7;g.add(energyRing);

  const shadow=new THREE.Mesh(new THREE.CircleGeometry(3.2,40),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.52}));
  shadow.rotation.x=-Math.PI/2;shadow.scale.set(1,.55,1);shadow.position.y=.02;g.add(shadow);

  g.position.set((Math.random()-.5)*18,0,-26);
  scene.add(g);
  enemies.push({mesh:g,elite:true,boss:true,hp:240,max:240,speed:1.22,flash:0});
}

function spawnEnemy(){
  const elite=Math.random()<Math.min(.08+wave*.012,.25);
  const side=Math.floor(Math.random()*4);
  let x,z;
  const edge=49;
  if(side===0){x=-edge;z=(Math.random()-.5)*90}
  else if(side===1){x=edge;z=(Math.random()-.5)*90}
  else if(side===2){x=(Math.random()-.5)*90;z=-edge}
  else{x=(Math.random()-.5)*90;z=edge}
  const e=makeEnemy(elite);
  e.position.set(x,0,z);
  enemies.push({mesh:e,elite,hp:elite?5:2,speed:(elite?1.7:2.4)+wave*.07,flash:0});
}
function spark(pos,count=10,color=0xffd45c){
  for(let i=0;i<count;i++){
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.045+Math.random()*.07,0),new THREE.MeshBasicMaterial({color,transparent:true}));
    m.position.copy(pos);scene.add(m);
    const v=new THREE.Vector3(Math.random()-.5,.25+Math.random()*.9,Math.random()-.5).normalize().multiplyScalar(3+Math.random()*8);
    particles.push({mesh:m,life:.25+Math.random()*.45,v});
  }
}
function shoot(){
  if(gameOver||fireTimer>0)return;
  const aim=getAim();
  aim.y=1.1;
  const gun=player.userData.gun;
  const from=new THREE.Vector3();player.localToWorld(from.set(.0,1.35,-1.9));
  const dir=aim.sub(from).normalize();

  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(.08,.08,.65,8),
    new THREE.MeshBasicMaterial({color:0xffeb72})
  );
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  mesh.position.copy(from);scene.add(mesh);
  bullets.push({mesh,dir,speed:42,life:1.25,dead:false});
  player.userData.muzzle.visible=true;
  setTimeout(()=>{if(player)player.userData.muzzle.visible=false},55);
  spark(from,3,0x7cf7ff);
  fireTimer=.11;shake=.08;
}

function updateHud(){
  const hp=Math.max(0,player.userData.hp);
  hpText.textContent=Math.ceil(hp);
  healthFill.style.width=hp+'%';
  scoreText.textContent=score;
  waveText.textContent=wave;
  enemiesText.textContent=enemies.length;
  const boss=enemies.find(e=>e.boss&&e.mesh.visible);
  bossHud.style.opacity=boss?'1':'0';
  if(boss)bossFill.style.width=Math.max(0,boss.hp/boss.max*100)+'%';
}

function announce(text){
  waveBanner.textContent=text;
  waveBanner.style.opacity='1';
  bannerTimer=1.15;
}
function updateStorm(dt){
  storm.timer-=dt;
  if(!storm.active&&storm.timer<=0){
    storm.active=true;
    storm.duration=10+Math.random()*5;
    storm.lightning=.8;
    rain.visible=true;
    stormHud.style.opacity='1';
    stormOverlay.style.opacity='.42';
    announce('STORM');
  }
  if(storm.active){
    storm.duration-=dt;
    rain.position.x=player.position.x;
    rain.position.z=player.position.z;
    const pos=rain.geometry.attributes.position.array;
    for(let i=0;i<rainCount;i++){
      const j=i*6;
      pos[j+1]-=26*dt;
      pos[j+4]-=26*dt;
      pos[j]+=1.2*dt;
      pos[j+3]+=1.2*dt;
      if(pos[j+1]<-.5){
        const rx=(Math.random()-.5)*96,rz=(Math.random()-.5)*96;
        pos[j]=rx;pos[j+1]=28+Math.random()*5;pos[j+2]=rz;
        pos[j+3]=rx+.8;pos[j+4]=pos[j+1]-2.3;pos[j+5]=rz+.6;
      }
    }
    rain.geometry.attributes.position.needsUpdate=true;

    stormLight.intensity=1.0;
    keyLight.intensity=1.1;
    cyanLight.intensity=9;
    storm.lightning-=dt;
    if(storm.lightning<=0){
      lightningLight.position.set(
        player.position.x+(Math.random()-.5)*35,
        22,
        player.position.z+(Math.random()-.5)*35
      );
      lightningLight.intensity=25;
      storm.lightning=.15;
    }else if(lightningLight.intensity>0){
      lightningLight.intensity=Math.max(0,lightningLight.intensity-dt*120);
      if(lightningLight.intensity<1)storm.lightning=.7+Math.random()*2.2;
    }
    if(storm.duration<=0){
      storm.active=false;
      storm.timer=17+Math.random()*15;
      rain.visible=false;
      stormHud.style.opacity='0';
      stormOverlay.style.opacity='0';
      lightningLight.intensity=0;
      stormLight.intensity=0;
      keyLight.intensity=3.2;
      cyanLight.intensity=18;
    }
  }
}

function reset(){
  if(player)scene.remove(player);
  if(enemies)for(const e of enemies)scene.remove(e.mesh);
  if(bullets)for(const b of bullets)scene.remove(b.mesh);
  if(enemyBullets)for(const b of enemyBullets)scene.remove(b.mesh);
  if(particles)for(const p of particles)scene.remove(p.mesh);
  enemies=[];bullets=[];enemyBullets=[];particles=[];
  player=makePlayer();player.userData.hp=100;
  player.position.set(0,0,8);
  score=0;wave=1;spawnRemaining=10;spawnTimer=.25;fireTimer=0;gameOver=false;shake=0;bannerTimer=0;
  bossQueued=false;bossShotTimer=0;
  storm.active=false;storm.timer=12;storm.duration=0;storm.lightning=1.2;
  rain.visible=false;stormHud.style.opacity='0';bossHud.style.opacity='0';stormOverlay.style.opacity='0';
  lightningLight.intensity=0;stormLight.intensity=0;keyLight.intensity=3.2;cyanLight.intensity=18;
  overlay.style.visibility='hidden';
  announce('WAVE 1');
  updateHud();
}

reset();

function update(dt){
  if(gameOver)return;
  const t=Math.min(dt,.033);
  updateStorm(t);

  let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const ml=Math.hypot(mx,mz)||1;
  mx/=ml;mz/=ml;
  player.position.x=THREE.MathUtils.clamp(player.position.x+mx*10*t,-45,45);
  player.position.z=THREE.MathUtils.clamp(player.position.z+mz*10*t,-45,45);

  const aim=getAim();
  const look=aim.clone();look.y=player.position.y;
  const yaw=Math.atan2(look.x-player.position.x,look.z-player.position.z);
  player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,yaw,.25);

  fireTimer-=t;
  if(mouse.down)shoot();

  spawnTimer-=t;
  if(spawnRemaining>0&&spawnTimer<=0){
    spawnEnemy();
    spawnRemaining--;
    spawnTimer=Math.max(.2,.62-wave*.02);
  }
  if(spawnRemaining===0&&enemies.length===0&&!bossQueued){
    wave++;
    if(wave%5===0){
      spawnRemaining=0;
      bossQueued=true;
      spawnTimer=1.6;
      announce('RAID BOSS');
    }else{
      spawnRemaining=8+wave*3;
      spawnTimer=1.15;
      announce('WAVE '+wave);
    }
  }
  if(bossQueued&&spawnTimer<=0){
    spawnRaidBoss();
    bossQueued=false;
    bossShotTimer=1.2;
    bossHud.style.opacity='1';
  }

  for(const b of bullets){
    b.mesh.position.addScaledVector(b.dir,b.speed*t);
    b.life-=t;
    for(const e of enemies){
      if(b.dead||!e.mesh.visible)continue;
      const target=new THREE.Vector3(e.mesh.position.x,1.2,e.mesh.position.z);
      if(b.mesh.position.distanceTo(target)<(e.elite?1.45:1.15)){
        b.dead=true;
        e.hp--;
        e.flash=.08;
        spark(b.mesh.position,e.elite?7:5,e.elite?0xff6baa:0xffcf5a);
        if(e.hp<=0){
          score+=e.boss?1500:(e.elite?90:25);
          spark(target,e.boss?40:(e.elite?22:14),e.boss?0xff66ad:(e.elite?0xff5fa3:0xffdf65));
          e.mesh.visible=false;
          if(e.boss){bossHud.style.opacity='0';announce('BOSS DEFEATED');shake=.45}
        }
      }
    }
  }
  bullets=bullets.filter(b=>{
    if(b.dead||b.life<=0){scene.remove(b.mesh);return false}
    return true;
  });

  const ppos=new THREE.Vector3(player.position.x,0,player.position.z);
  bossShotTimer-=t;
  for(const e of enemies){
    if(!e.mesh.visible)continue;
    const epos=new THREE.Vector3(e.mesh.position.x,0,e.mesh.position.z);
    const d=epos.distanceTo(ppos);
    if(e.flash>0){
      e.flash-=t;
      e.mesh.scale.setScalar(e.boss?1.04:1.08);
    }else{
      e.mesh.scale.lerp(new THREE.Vector3(1,1,1),.18);
    }

    if(d>1.9){
      const dir=ppos.clone().sub(epos).normalize();
      e.mesh.position.addScaledVector(dir,(e.boss?e.speed:e.speed)*t);
      e.mesh.rotation.y=Math.atan2(dir.x,dir.z);
    }else{
      player.userData.hp-=e.boss?48*t:(e.elite?24*t:34*t);
      flash.style.opacity='0.3';
      shake=e.boss?.23:.18;
    }

    if(e.boss&&bossShotTimer<=0){
      const start=new THREE.Vector3(e.mesh.position.x,3,e.mesh.position.z);
      const target=new THREE.Vector3(player.position.x,1.15,player.position.z);
      const dir=target.sub(start).normalize();
      const shot=new THREE.Mesh(new THREE.SphereGeometry(.3,12,12),new THREE.MeshBasicMaterial({color:0xff477f}));
      shot.position.copy(start);scene.add(shot);
      enemyBullets.push({mesh:shot,dir,speed:13,life:5});
      const beam=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.2,8),new THREE.MeshBasicMaterial({color:0xff8bb7,transparent:true,opacity:.75}));
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
      beam.position.copy(start);scene.add(beam);
      particles.push({mesh:beam,life:.15,v:new THREE.Vector3()});
      bossShotTimer=1.65;
    }
  }

  enemies=enemies.filter(e=>{
    if(!e.mesh.visible){scene.remove(e.mesh);return false}
    return true;
  });

  for(const b of enemyBullets){
    b.mesh.position.addScaledVector(b.dir,b.speed*t);
    b.life-=t;
    const pd=b.mesh.position.distanceTo(new THREE.Vector3(player.position.x,1.1,player.position.z));
    if(pd<1.25){
      b.life=0;
      player.userData.hp-=12;
      flash.style.opacity='0.5';
      shake=.25;
      spark(b.mesh.position,8,0xff6b9e);
    }
  }
  enemyBullets=enemyBullets.filter(b=>{
    if(b.life<=0){scene.remove(b.mesh);return false}
    return true;
  });

  for(const p of particles){
    p.life-=t;
    p.mesh.position.addScaledVector(p.v,t);
    p.v.multiplyScalar(.93);
    p.mesh.material.opacity=Math.max(0,p.life*2);
  }
  particles=particles.filter(p=>{
    if(p.life<=0){scene.remove(p.mesh);return false}
    return true;
  });

  camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x,Math.min(1,6*t));
  camera.position.z=THREE.MathUtils.lerp(camera.position.z,player.position.z+14,Math.min(1,6*t));
  camera.position.y=THREE.MathUtils.lerp(camera.position.y,10,Math.min(1,6*t));
  const camLook=new THREE.Vector3(player.position.x,1.15,player.position.z);
  camera.lookAt(camLook);

  ring.position.x=player.position.x;
  ring.position.z=player.position.z;
  ring.rotation.z+=t*.6;

  if(shake>0){
    shake=Math.max(0,shake-t*1.8);
    camera.position.x+=(Math.random()-.5)*shake;
    camera.position.y+=(Math.random()-.5)*shake;
  }
  flash.style.opacity=String(Math.max(0,parseFloat(flash.style.opacity||0)-t*2.6));
  bannerTimer-=t;
  if(bannerTimer<=0)waveBanner.style.opacity='0';

  if(player.userData.hp<=0){
    player.userData.hp=0;
    gameOver=true;
    finalScore.textContent=score;
    finalWave.textContent=wave;
    overlay.style.visibility='visible';
  }
  updateHud();
}

function animate(time){
  const dt=(time-lastTime)/1000||0;
  lastTime=time;
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
requestAnimationFrame(animate);
</script>
</body>
</html>
