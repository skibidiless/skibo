<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Strike — 2D Shooter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070a12;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#0b1020;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;padding:18px;font-weight:700;text-shadow:0 2px 4px #000}
.row{display:flex;gap:22px;align-items:center}.bar{width:180px;height:14px;border:2px solid #fff8;border-radius:10px;overflow:hidden;background:#0008}.fill{height:100%;background:#35e06f;width:100%}
#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;color:#b9c5dd;pointer-events:none}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0009;visibility:hidden}
.card{background:#111827;border:1px solid #ffffff22;border-radius:18px;padding:32px 44px;text-align:center;box-shadow:0 20px 80px #000}
button{border:0;border-radius:10px;padding:12px 22px;font-weight:800;cursor:pointer;background:#36e37b;color:#07100b}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="row"><span>❤️ <span id="hp">100</span></span><div class="bar"><div id="hpbar" class="fill"></div></div><span>🎯 <span id="score">0</span></span><span>🌊 Wave <span id="wave">1</span></span></div></div>
<div id="help">WASD / Arrow Keys = move · Mouse = aim · Click / Space = shoot · R = restart</div>
<div id="overlay"><div class="card"><h1>GAME OVER</h1><p>Score: <b id="finalScore">0</b></p><button id="restart">PLAY AGAIN</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),hpEl=document.getElementById('hp'),bar=document.getElementById('hpbar'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore');
let W,H,dpr,keys={},mouse={x:0,y:0,down:false},player,enemies,bullets,particles,score,wave,spawnLeft,spawnTimer,last=0,gameOver=false,fireCd=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H/2,r:17,speed:260,hp:100};enemies=[];bullets=[];particles=[];score=0;wave=1;spawnLeft=8;spawnTimer=0;fireCd=0;gameOver=false;overlay.style.visibility='hidden';updateHud()} reset();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')mouse.down=true;if(e.key.toLowerCase()==='r'&&gameOver)reset()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')mouse.down=false});
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);document.getElementById('restart').onclick=reset;
function spawn(){let side=Math.floor(Math.random()*4),px=side===0?-30:side===1?W+30:Math.random()*W,py=side===2?-30:side===3?H+30:Math.random()*H;let elite=Math.random()<Math.min(.08+wave*.01,.22);enemies.push({x:px,y:py,r:elite?22:14,speed:(elite?65:85)+wave*4,hp:elite?3:1,max:elite?3:1,elite})}
function shoot(){if(fireCd>0)return;let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x+Math.cos(a)*22,y:player.y+Math.sin(a)*22,vx:Math.cos(a)*700,vy:Math.sin(a)*700,r:4,life:1});fireCd=.13}
function burst(px,py,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*180;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45})}}
function update(dt){if(gameOver)return;
let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1;
player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx/len*player.speed*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy/len*player.speed*dt));
fireCd-=dt;if(mouse.down)shoot();
spawnTimer-=dt;if(spawnLeft>0&&spawnTimer<=0){spawn();spawnLeft--;spawnTimer=Math.max(.18,.75-wave*.035)}
if(spawnLeft===0&&enemies.length===0){wave++;spawnLeft=6+wave*3;spawnTimer=1;waveEl.textContent=wave}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
for(let e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;let d=Math.hypot(player.x-e.x,player.y-e.y);if(d<player.r+e.r){player.hp-=28*dt;burst(player.x,player.y,1);}}
for(let b of bullets){for(let e of enemies){if(!b.hit&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){b.hit=true;e.hp--;burst(b.x,b.y,5);if(e.hp<=0){score+=e.elite?50:10;burst(e.x,e.y,12)}}}}
enemies=enemies.filter(e=>e.hp>0);bullets=bullets.filter(b=>!b.hit);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(player.hp<=0){player.hp=0;gameOver=true;finalScore.textContent=score;overlay.style.visibility='visible'}updateHud()}
function updateHud(){hpEl.textContent=Math.ceil(player.hp);bar.style.width=player.hp+'%';scoreEl.textContent=score;waveEl.textContent=wave}
function draw(){x.clearRect(0,0,W,H);let g=x.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H));g.addColorStop(0,'#151d36');g.addColorStop(1,'#060810');x.fillStyle=g;x.fillRect(0,0,W,H);
x.strokeStyle='#ffffff0b';x.lineWidth=1;for(let gx=0;gx<W;gx+=50){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=0;gy<H;gy+=50){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
for(let p of particles){x.globalAlpha=Math.max(0,p.life*2);x.fillStyle='#ffd166';x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}x.globalAlpha=1;
for(let b of bullets){x.fillStyle='#ffe66d';x.shadowBlur=12;x.shadowColor='#ffe66d';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.shadowBlur=0}
for(let e of enemies){x.fillStyle=e.elite?'#ff4d8d':'#ff465d';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#180b13';x.beginPath();x.arc(e.x-5,e.y-2,3,0,7);x.arc(e.x+5,e.y-2,3,0,7);x.fill();if(e.elite){x.strokeStyle='#ff9abc';x.lineWidth=3;x.stroke()}}
let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);x.save();x.translate(player.x,player.y);x.rotate(a);x.fillStyle='#dce7ff';x.fillRect(5,-5,27,10);x.fillStyle='#38e7ff';x.beginPath();x.arc(0,0,player.r,0,7);x.fill();x.restore();
x.fillStyle='#fff';x.font='12px Arial';x.textAlign='center';x.fillText('YOU',player.x,player.y+4)}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
